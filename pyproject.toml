[project]
name = "aircraft-rul-prognostics"
version = "0.1.0"
description = "NASA C-MAPSS turbofan engine Remaining Useful Life (RUL) prognostics ML pipeline"
authors = [
    { name = "Boby Dubey", email = "bobydubey@fico.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.140.13",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "llvmlite>=0.43",
    "matplotlib>=3.11.1",
    "numba>=0.60",
    "numpy>=2.4.6",
    "omegaconf>=2.3.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.50.0",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
# Installed by a plain `uv sync`. Deliberately excluded from the API image
# (`uv sync --no-dev`), so nothing under api/ may import mlflow or pytest.
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    # mlflow-skinny, not mlflow: the full package pins pandas<3 / pyarrow<24, which
    # this project can't satisfy. Skinny is the same client (tracking, flavors,
    # registry API) without those pins; the *server* runs from its own image in
    # docker-compose, so nothing here needs the heavy extras.
    "mlflow-skinny>=3.0.0",
    "nbformat>=5.10.4",
    "notebook>=7.6.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs the full built feature tables / trained model artifacts on disk",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "frontend-react"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]  # E501: long lines are handled by the formatter; B008: FastAPI Depends/File idiom
